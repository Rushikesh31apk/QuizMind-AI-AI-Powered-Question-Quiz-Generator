<div class="qm-navbar-wrap">
  <nav class="qm-navbar">
    <a href="{{ url_for('main.index') }}" class="qm-logo">
      <span class="spark"><i class="bi bi-stars"></i></span>
      QuizMind AI
    </a>

    <div class="qm-nav-links">
      <a href="{{ url_for('main.index') }}#features">Features</a>
      <a href="{{ url_for('main.index') }}#how-it-works">How It Works</a>
      <a href="{{ url_for('main.index') }}#subjects">Subjects</a>
      <a href="{{ url_for('main.index') }}#ai-quiz">AI Quiz</a>
      <a href="{{ url_for('main.index') }}#about">About</a>
    </div>

    <div class="qm-nav-actions">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('admin.dashboard') if current_user.is_admin else url_for('student.dashboard') }}" class="btn btn-qm-primary btn-sm-pill">
          <i class="bi bi-grid"></i> Dashboard
        </a>
      {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-qm-ghost btn-sm-pill d-none d-sm-inline-flex">Login</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-qm-primary btn-sm-pill">Get Started</a>
      {% endif %}
      <button class="btn btn-qm-ghost btn-sm-pill d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav">
        <i class="bi bi-list fs-5"></i>
      </button>
    </div>
  </nav>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav">
  <div class="offcanvas-header">
    <span class="qm-logo"><span class="spark"><i class="bi bi-stars"></i></span> QuizMind AI</span>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column gap-2">
    <a href="{{ url_for('main.index') }}#features" class="btn btn-qm-outline text-start">Features</a>
    <a href="{{ url_for('main.index') }}#how-it-works" class="btn btn-qm-outline text-start">How It Works</a>
    <a href="{{ url_for('main.index') }}#subjects" class="btn btn-qm-outline text-start">Subjects</a>
    <a href="{{ url_for('main.index') }}#ai-quiz" class="btn btn-qm-outline text-start">AI Quiz</a>
    <a href="{{ url_for('main.index') }}#about" class="btn btn-qm-outline text-start">About</a>
    <hr class="qm-divider">
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('admin.dashboard') if current_user.is_admin else url_for('student.dashboard') }}" class="btn btn-qm-primary">Dashboard</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-qm-outline">Login</a>
      <a href="{{ url_for('auth.register') }}" class="btn btn-qm-primary">Get Started</a>
    {% endif %}
  </div>
</div>
