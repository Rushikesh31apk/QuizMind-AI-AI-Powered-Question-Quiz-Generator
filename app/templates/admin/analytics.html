{% extends "admin/_layout.html" %}
{% block title %}Analytics{% endblock %}
{% block page_heading %}Analytics{% endblock %}
{% block content %}
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="qm-card stat-card"><div class="stat-icon"><i class="bi bi-people"></i></div><div><div class="stat-value">{{ total_students }}</div><div class="stat-label">Students</div></div></div></div>
  <div class="col-md-4"><div class="qm-card stat-card"><div class="stat-icon"><i class="bi bi-clock-history"></i></div><div><div class="stat-value">{{ total_attempts }}</div><div class="stat-label">Attempts</div></div></div></div>
  <div class="col-md-4"><div class="qm-card stat-card"><div class="stat-icon"><i class="bi bi-percent"></i></div><div><div class="stat-value">{{ avg_score }}%</div><div class="stat-label">Average Score</div></div></div></div>
</div>
<div class="row g-4">
  <div class="col-lg-8"><div class="qm-panel"><h5 class="qm-panel-title mb-3">Average Score by Subject</h5><div style="height:280px"><canvas data-chart="bar" data-label="Avg %" data-labels='{{ subject_avg|map(attribute="label")|list|tojson }}' data-values='{{ subject_avg|map(attribute="value")|list|tojson }}'></canvas></div></div></div>
  <div class="col-lg-4"><div class="qm-panel"><h5 class="qm-panel-title mb-3">Questions by Difficulty</h5><div style="height:280px"><canvas data-chart="doughnut" data-multi-colors="true" data-labels='{{ difficulty_dist|map(attribute="label")|list|tojson }}' data-values='{{ difficulty_dist|map(attribute="value")|list|tojson }}'></canvas></div></div></div>
</div>
{% endblock %}
